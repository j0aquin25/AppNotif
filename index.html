<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Tareas</title>
<meta name="theme-color" content="#f6f5fb" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Tareas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1 id="title">Hoy</h1>
    <div class="actions">
      <span class="pill" id="pts-pill">0 pts</span>
      <button class="icon-btn" id="theme-btn" aria-label="Cambiar tema">🌙</button>
    </div>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" aria-label="Nueva tarea">+</button>
  <nav class="tabbar" id="tabbar">
    <button data-tab="hoy"><span class="i">📅</span>Hoy</button>
    <button data-tab="tareas"><span class="i">✅</span>Tareas</button>
    <button data-tab="premios"><span class="i">🎁</span>Premios</button>
    <button data-tab="perfil"><span class="i">⭐</span>Perfil</button>
  </nav>
</div>
<div class="backdrop hidden" id="backdrop"></div>
<div class="sheet hidden" id="sheet"></div>
<div id="toasts"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
